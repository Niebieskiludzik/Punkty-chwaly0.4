<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktywacja konta - Ranking Chwały</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #161b26;
      border: 1.5px solid #ffd700;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { color: #ffd700; font-size: 22px; margin: 0 0 12px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
    .btn {
      background: linear-gradient(135deg, #fc5c04, #ffd700);
      color: #000;
      font-weight: bold;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      display: inline-block;
      font-size: 15px;
    }
  </style>
  <script>
    window.onload = function() {
      // Automatyczna próba otwarcia aplikacji na telefonie Android
      setTimeout(function() {
        window.location.href = "intent://ranking#Intent;scheme=rankingapp;package=com.example;end";
      }, 800);
    };
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Konto zostało aktywowane!</h1>
    <p>Twój e-mail został pomyślnie zweryfikowany. Za chwilę nastąpi automatyczne przekierowanie do aplikacji.</p>
    <a href="intent://ranking#Intent;scheme=rankingapp;package=com.example;end" class="btn">Otwórz aplikację</a>
  </div>
</body>
</html>
